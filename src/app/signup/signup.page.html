<ion-header class="ion-no-border">
<header class="top-nav">
    <ion-menu-button style="color: var(--tm-white);"></ion-menu-button>
  <a routerLink="/homepage" class="logo">
    <img src="assets/images/tripmate.svg" alt="TripMate" class="logo-img">
  </a>
  <a routerLink="/homepage" class="back-link">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to home
  </a>
</header>
</ion-header>
<ion-content>


<main>
  <div class="card" id="signup-card" [class.host-mode]="mode === 'host'">
    <div class="tabs" role="tablist">
      <button type="button" [class.active]="mode === 'guest'" (click)="setMode('guest')" role="tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21v-1a8 8 0 0 1 16 0v1" />
        </svg>
        Guest
      </button>
      <button type="button" [class.active]="mode === 'host'" (click)="setMode('host')" role="tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg>
        Host
      </button>
    </div>

    <h1 id="form-title">{{ mode === 'guest' ? 'Create an Account' : 'Become a Host' }}</h1>
    <p class="sub">Already have an account? <a routerLink="/login">Log in</a></p>

    <form (ngSubmit)="signup()" novalidate>
      <div class="field" [class.has-error]="nameError">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" [(ngModel)]="fullName" placeholder="Juan Dela Cruz" autocomplete="name" [class.invalid]="nameError" required />
        <div class="error-msg" *ngIf="nameError">{{ nameError }}</div>
      </div>

      <div class="field" [class.has-error]="emailError">
        <label for="email">Email Address</label>
        <span class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 6 12 13 2 6" />
            <path d="M2 6h20v12H2z" />
          </svg>
        </span>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="you@example.com" autocomplete="email" [class.invalid]="emailError" required />
        <div class="error-msg" *ngIf="emailError">{{ emailError }}</div>
      </div>

      <div class="field host-only" *ngIf="mode === 'host'">
        <label for="businessName">Property / Business Name</label>
        <input type="text" id="businessName" name="businessName" [(ngModel)]="businessName" placeholder="e.g. Vessel Hostel & Surf" autocomplete="organization" />
      </div>

      <div class="field" [class.has-error]="passwordError">
        <label for="password">Password</label>
        <span class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="10" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password" placeholder="At least 8 characters" autocomplete="new-password" [class.invalid]="passwordError" required />
        <button type="button" class="toggle-pw" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s4 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/></svg>
          <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="error-msg" *ngIf="passwordError">{{ passwordError }}</div>
      </div>

      <div class="field" [class.has-error]="confirmError">
        <label for="confirmPassword">Confirm Password</label>
        <span class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="10" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" [class.invalid]="confirmError" required />
        <button type="button" class="toggle-pw" (click)="toggleConfirmPassword()" [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
          <svg *ngIf="showConfirmPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s4 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/></svg>
          <svg *ngIf="!showConfirmPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="error-msg" *ngIf="confirmError">{{ confirmError }}</div>
      </div>

      <div class="checkbox-row" [class.has-error]="termsError">
        <input type="checkbox" id="terms" name="terms" [(ngModel)]="agreed" />
        <label for="terms" style="margin:0;">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating account…' : 'Create Account' }}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </button>
    </form>

    <p class="secure-note">Secure signup powered by TripMate</p>
  </div>
</main>
<div class="toast" [class.show]="showToast" [class.error-toast]="toastError">{{ toastMessage }}</div>
</ion-content>
