<ion-header class="ion-no-border" style="background: #0F2E25;">
  <app-auth-buttons></app-auth-buttons>
</ion-header>
<ion-content>
  <div class="page-container">
    <div class="header-section">
      <img src="assets/images/tripmate-logo.png" alt="TripMate Logo" class="app-logo" onerror="this.src='assets/images/tripmate.svg'; this.style.filter='invert(1)';">
      <h1 class="page-title">TripMate</h1>
      <p class="app-version">Version 1.0.0</p>
    </div>
    
    <div class="content-card">
      <p class="story-text"><strong>A Filipino-built mobile app for booking hotels and house rentals across the Philippines.</strong></p>
      
      <div class="tech-stack">
        <h3>Powered By</h3>
        <div class="stack-tags">
          <span class="tag ionic">Ionic Framework</span>
          <span class="tag angular">Angular</span>
          <span class="tag supabase">Supabase</span>
        </div>
      </div>

      <div class="credits">
        <p>Proudly designed & developed by <strong>Group 10</strong>.</p>
      </div>
    </div>
  </div>
</ion-content>
